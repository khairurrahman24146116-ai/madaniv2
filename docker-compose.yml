services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - ./.env:/var/www/html/.env
      - app-public:/var/www/html/storage/app/public
      - app-backups:/var/www/html/storage/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - madani

  db:
    image: mysql:8.4
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-madani_al_aziziyah}
      MYSQL_USER: ${DB_USERNAME:-madani}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - madani

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - madani

volumes:
  db-data:
  app-public:
  app-backups:

networks:
  madani:
    driver: bridge