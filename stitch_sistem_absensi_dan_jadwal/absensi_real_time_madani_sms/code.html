<script>
        // Update live timestamp
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('current-time').textContent = `Timestamp: ${timeString}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // State Management
        let counts = { H: 0, S: 0, I: 0, A: 0 };
        const summaryIds = { H: 'count-present', S: 'count-excused', I: 'count-excused', A: 'count-absent' };

        function setStatus(btn, status) {
            const parent = btn.closest('.student-card');
            const prevActive = parent.querySelector('.status-active');
            
            // Revert previous if exists
            if (prevActive) {
                const prevStatus = prevActive.getAttribute('data-status');
                counts[prevStatus]--;
                prevActive.className = 'status-btn flex-1 sm:w-12 py-1 px-2 rounded-md font-label-md text-label-md text-on-surface-variant transition-all hover:bg-surface-container-high active:scale-95';
                prevActive.classList.remove('status-active');
            }

            // Apply new
            btn.classList.add('status-active');
            btn.setAttribute('data-status', status);
            counts[status]++;

            const styleMap = {
                'H': 'bg-green-600 text-white shadow-sm',
                'S': 'bg-amber-500 text-white shadow-sm',
                'I': 'bg-blue-500 text-white shadow-sm',
                'A': 'bg-red-600 text-white shadow-sm'
            };

            btn.className = `status-btn status-active flex-1 sm:w-12 py-1 px-2 rounded-md font-label-md text-label-md transition-all active:scale-95 ${styleMap[status]}`;
            parent.classList.add('student-card-active');

            updateSummary();
        }

        function updateSummary() {
            document.getElementById('count-present').textContent = counts.H;
            document.getElementById('count-excused').textContent = counts.S + counts.I;
            document.getElementById('count-absent').textContent = counts.A;
        }

        function handleSubmit() {
            const total = students.length;
            const filled = counts.H + counts.S + counts.I + counts.A;
            
            if (filled < total) {
                alert(`Absensi belum lengkap. Baru ${filled} dari ${total} siswa.`);
            } else {
                alert(`Absensi berhasil dikirim!\n\nHadir: ${counts.H}\nSakit/Izin: ${counts.S + counts.I}\nAlpa: ${counts.A}`);
            }
        }
    </script>
